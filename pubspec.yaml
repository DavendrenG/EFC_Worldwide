name: efc_app
description: EFC Worldwide mobile app - events, athletes, fight archive and news.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # State
  provider: ^6.1.2
  collection: ^1.18.0

  # Networking + local storage
  http: ^1.2.1
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1

  # Typography
  google_fonts: ^6.2.1

  # Video
  video_player: ^2.8.6

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.6
  share_plus: ^7.2.2

  # Push - Google Mobile Services (Android + iOS/APNs)
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.2
  flutter_local_notifications: ^17.1.2

  # Push - Huawei Mobile Services (Android-only, no-ops elsewhere).
  # Comment this out if you are not shipping to AppGallery; see
  # platform_config/huawei/SETUP.md before enabling.
  huawei_push: ^6.12.0+300

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
