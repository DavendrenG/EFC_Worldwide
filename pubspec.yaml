name: efc_app
description: EFC Worldwide mobile app - events, athletes, fight archive and news.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # State
  provider: ^6.1.2
  collection: ^1.18.0

  # Networking + local storage
  http: ^1.2.1
  xml: ^6.5.0
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1

  # Typography
  google_fonts: ^6.2.1

  # Video
  video_player: ^2.8.6

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.6
  share_plus: ^7.2.2

  # Push - Google Mobile Services (Android + iOS/APNs)
  firebase_core: ^2.31.0
  cloud_firestore: ^4.17.5
  firebase_messaging: ^14.9.2
  flutter_local_notifications: ^17.1.2

  # Push - Huawei Mobile Services (Android-only, no-ops elsewhere).
  # Comment this out if you are not shipping to AppGallery; see
  # platform_config/huawei/SETUP.md before enabling.
  huawei_push: ^6.12.0+300

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/
    - assets/images/

# ── App icon ───────────────────────────────────────────────────────────────
# Regenerate after dropping in EFC's real logo:
#   python3 tools/make_icons.py --logo assets/brand/efc-logo.png
#   flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: "ic_launcher"
  # Adaptive icon: launchers mask this to a circle, squircle or rounded
  # square, so the foreground carries deliberate padding.
  adaptive_icon_background: "#08090B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # Android 13+ themed icon, recoloured to the user's wallpaper.
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 23

  ios: true
  # The App Store rejects icons containing an alpha channel.
  remove_alpha_ios: true

# ── Splash ─────────────────────────────────────────────────────────────────
# The native splash covers the gap before Flutter's first frame; the animated
# SplashScreen takes over from there. Both use #08090B so there is no flash
# at the handover.
flutter_native_splash:
  color: "#08090B"
  image: assets/splash/splash.png
  branding: assets/splash/branding.png
  branding_mode: bottom

  color_dark: "#08090B"
  image_dark: assets/splash/splash.png
  branding_dark: assets/splash/branding.png

  android_12:
    # Android 12+ draws its own splash and masks the icon to a circle —
    # only the centre ~60% shows, which is why the source is padded.
    color: "#08090B"
    image: assets/splash/splash.png
    icon_background_color: "#08090B"
    color_dark: "#08090B"
    image_dark: assets/splash/splash.png
    icon_background_color_dark: "#08090B"

  android: true
  ios: true
  web: false
